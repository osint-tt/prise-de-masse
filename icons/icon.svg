<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Protal">
  <rect width="512" height="512" rx="112" ry="112" fill="#000000"/>
  <!-- Contour blanc fin, calé sur le bord : détache l'icône d'un fond sombre.
       Le trait est centré sur un rectangle rentré de 6, donc son bord extérieur
       tombe pile sur celui de l'icône, sans être rogné. -->
  <rect x="6" y="6" width="500" height="500" rx="106" ry="106" fill="none" stroke="#ffffff" stroke-width="12"/>
  <g fill="#ffffff">
    <rect x="152" y="236" width="208" height="40" rx="10" ry="10"/>
    <rect x="112" y="181" width="44" height="150" rx="16" ry="16"/>
    <rect x="356" y="181" width="44" height="150" rx="16" ry="16"/>
    <rect x="64" y="206" width="36" height="100" rx="14" ry="14"/>
    <rect x="412" y="206" width="36" height="100" rx="14" ry="14"/>
  </g>
</svg>
